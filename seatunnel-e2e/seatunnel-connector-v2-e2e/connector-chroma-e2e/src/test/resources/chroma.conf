env {
    job.mode = ${chroma.jobMode}
    parallelism = ${chroma.parallelism}
    checkpoint.interval = ${chroma.checkpoint}
    checkpoint.timeout = 30000
    job.retry.times = 0
}
source {
    FakeSource {
        plugin_output = "input"
        row.num = ${chroma.rowNum}
        split.num = ${chroma.splitNum}
        split.read-interval = ${chroma.interval}
        schema {
            fields {
                id = bigint
                body = string
                tenant = string
                feed = string
                vector = "array<double>"
                context = {
                    team = string
                    flag = boolean
                }
                users = "array<map<string, string>>"
                optional = string
                _ab_cdc_deleted_at = string
            }
        }
        rows = ${chroma.rows}
    }
}
sink {
    Chroma {
        plugin_input = "input"
        endpoint = ${chroma.endpoint}
        token = ${chroma.token}
        username = ${chroma.user}
        password = ${chroma.password}
        tls_trust_certificate = ${chroma.trust}
        batch_size = ${chroma.batch}
        collection = ${chroma.collection}
        mode = ${chroma.mode}
        namespace = ${chroma.namespace}
        stream = ${chroma.stream}
        namespace_field = ${chroma.namespaceField}
        stream_field = ${chroma.streamField}
        primary_keys = ${chroma.keys}
        text_fields = ${chroma.textFields}
        metadata_fields = ${chroma.metadataFields}
        field_name_mappings = ${chroma.aliases}
        omit_raw_text = ${chroma.omit}
        splitter = ${chroma.splitter}
        separators = ${chroma.separators}
        keep_separator = ${chroma.keep}
        code_language = ${chroma.language}
        markdown_level = ${chroma.markdown}
        chunk_size = ${chroma.chunk}
        chunk_overlap = ${chroma.overlap}
        tokenizer_data_file = ${chroma.ranks}
        embedding_mode = ${chroma.embedding}
        embedding_url = ${chroma.embedUrl}
        embedding_secret_key = ${chroma.embedToken}
        embedding_model = "fixture-openai-compatible"
        embedding_deployment = "fixture-deployment"
        embedding_field = "vector"
        embedding_dimensions = ${chroma.dimensions}
        max_row_bytes = ${chroma.maxRow}
        max_buffer_bytes = ${chroma.maxBuffer}
        max_body_bytes = ${chroma.maxBody}
        max_chunks_per_row = ${chroma.maxChunks}
        request_timeout_ms = ${chroma.deadline}
        max_attempts = ${chroma.attempts}
    }
}
